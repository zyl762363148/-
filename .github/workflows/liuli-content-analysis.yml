name: Liuli content analysis

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      page:
        description: "AIC source page (1-1000); leave blank for the daily page"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: liuli-content-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install image and malware analyzers
        run: |
          python -m pip install -r scripts/analysis-requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo freshclam || true
      - name: Verify pixel analyzer
        run: python -m unittest discover -s scripts -p "test_analyze_content.py"
      - name: Analyze shadow candidates
        env:
          LIULI_AUTOMATION_ORIGIN: ${{ secrets.LIULI_AUTOMATION_ORIGIN }}
          LIULI_AUTOMATION_ORIGIN_FALLBACK: https://liuli-wallpaper-gallery.mimonono.chatgpt.site
          LIULI_SITES_BYPASS_TOKEN: ${{ secrets.LIULI_SITES_BYPASS_TOKEN }}
          LIULI_INGESTION_PAGE: ${{ inputs.page }}
          LIULI_ANALYSIS_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          LIULI_ANALYSIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export LIULI_AUTOMATION_ORIGIN="${LIULI_AUTOMATION_ORIGIN:-$LIULI_AUTOMATION_ORIGIN_FALLBACK}"
          export LIULI_AUTOMATION_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=liuli-content-analysis" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python scripts/analyze_content.py --trigger-ingestion
